name: Validate

# The checks live in this file, not in scripts in the repository: the
# repository is the plugin's folder, and plugin directories refuse
# executable files in it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  manifests:
    name: Plugin manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail

          status=0
          fail() {
            echo "$1" >&2
            status=1
          }

          names=(
            "plugin.json:.name"
            ".claude-plugin/plugin.json:.name"
            ".cursor-plugin/plugin.json:.name"
            ".codex-plugin/plugin.json:.name"
            ".claude-plugin/marketplace.json:.plugins[0].name"
            ".cursor-plugin/marketplace.json:.plugins[0].name"
            ".agents/plugins/marketplace.json:.plugins[0].name"
          )
          descriptions=(
            "plugin.json:.description"
            ".claude-plugin/plugin.json:.description"
            ".cursor-plugin/plugin.json:.description"
            ".codex-plugin/plugin.json:.description"
            ".claude-plugin/marketplace.json:.plugins[0].description"
            ".cursor-plugin/marketplace.json:.plugins[0].description"
          )
          pointers=(
            ".claude-plugin/plugin.json:.skills"
            ".claude-plugin/plugin.json:.mcpServers"
            ".cursor-plugin/plugin.json:.skills"
            ".cursor-plugin/plugin.json:.mcpServers"
            ".codex-plugin/plugin.json:.skills"
            ".codex-plugin/plugin.json:.mcpServers"
            ".claude-plugin/plugin.json:.icon"
            ".cursor-plugin/plugin.json:.logo"
            'plugin.json:.extensions["com.openai"].interface.logo'
            'plugin.json:.extensions["com.openai"].interface.composerIcon'
          )

          read_field() {
            local file=${1%%:*} path=${1#*:}
            if [ ! -f "$file" ]; then
              echo "$file: missing" >&2
              return 1
            fi
            if ! jq -er "$path // empty" "$file" 2>/dev/null; then
              echo "$file: no $path" >&2
              return 1
            fi
          }

          check_same() {
            local label=$1
            shift
            local expected="" source="" entry value
            for entry in "$@"; do
              if ! value=$(read_field "$entry"); then
                status=1
                continue
              fi
              if [ -z "$source" ]; then
                expected=$value
                source=${entry%%:*}
              elif [ "$value" != "$expected" ]; then
                fail "${entry%%:*}: $label differs from $source"
              fi
            done
          }

          check_same "plugin name" "${names[@]}"
          check_same "plugin description" "${descriptions[@]}"

          for entry in "${pointers[@]}"; do
            if ! target=$(read_field "$entry"); then
              status=1
              continue
            fi
            [ -e "$target" ] || fail "${entry%%:*}: ${entry#*:} points at $target, which does not exist"
          done

          # Like read_field, but prints any JSON value (objects and arrays
          # too) in a canonical form, so two files compare equal whatever
          # their key order.
          read_json() {
            local file=${1%%:*} path=${1#*:}
            if [ ! -f "$file" ]; then
              echo "$file: missing" >&2
              return 1
            fi
            if ! jq -ecS "$path // empty" "$file" 2>/dev/null; then
              echo "$file: no $path" >&2
              return 1
            fi
          }

          check_same_json() {
            local label=$1
            shift
            local expected="" source="" entry value
            for entry in "$@"; do
              if ! value=$(read_json "$entry"); then
                status=1
                continue
              fi
              if [ -z "$source" ]; then
                expected=$value
                source=${entry%%:*}
              elif [ "$value" != "$expected" ]; then
                fail "${entry%%:*}: $label differs from $source"
              fi
            done
          }

          # Codex reads the root plugin.json first when it declares the Agent
          # Plugins schema, and .codex-plugin/plugin.json only as a fallback
          # for older builds. Both must carry the same Codex settings.
          check_same_json "Codex interface" \
            'plugin.json:.extensions["com.openai"].interface' \
            '.codex-plugin/plugin.json:.interface'
          check_same_json "Codex onboardingSkill" \
            'plugin.json:.extensions["com.openai"].onboardingSkill' \
            '.codex-plugin/plugin.json:.extensions["com.openai"].onboardingSkill'
          if onboarding=$(read_field 'plugin.json:.extensions["com.openai"].onboardingSkill'); then
            [ -f "${onboarding#./}" ] || fail "plugin.json: onboardingSkill points at $onboarding, which does not exist"
          else
            status=1
          fi

          # The OpenAI directory needs a semantic version on the Codex
          # manifests. Claude Code's has none, so its installs follow each
          # commit instead of a pinned copy.
          check_same "Codex version" \
            "plugin.json:.version" \
            ".codex-plugin/plugin.json:.version"
          if version=$(read_field "plugin.json:.version"); then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "plugin.json: version $version is not a semantic version"
          fi
          jq -e 'has("version") | not' .claude-plugin/plugin.json >/dev/null \
            || fail ".claude-plugin/plugin.json: a version pins Claude Code users until it changes; leave it out"

          check_same_json "keywords" \
            "plugin.json:.keywords" \
            ".claude-plugin/plugin.json:.keywords" \
            ".cursor-plugin/plugin.json:.keywords" \
            ".codex-plugin/plugin.json:.keywords"

          # Codex shows the model at most 240 characters of the description.
          if description=$(read_field "plugin.json:.description"); then
            [ "${#description}" -le 240 ] || fail "plugin.json: description is ${#description} characters, over 240"
          fi

          # Limits from the Codex parser (defaultPrompt) and the OpenAI
          # directory (displayName, shortDescription).
          interface=plugin.json
          jq -e '.extensions["com.openai"].interface | (.displayName | length) <= 30' "$interface" >/dev/null \
            || fail "$interface: interface.displayName is over 30 characters"
          jq -e '.extensions["com.openai"].interface | (.shortDescription | length) <= 30' "$interface" >/dev/null \
            || fail "$interface: interface.shortDescription is over 30 characters"
          jq -e '.extensions["com.openai"].interface.defaultPrompt | length <= 3' "$interface" >/dev/null \
            || fail "$interface: interface.defaultPrompt has more than 3 prompts"
          jq -e '[.extensions["com.openai"].interface.defaultPrompt[] | length <= 128] | all' "$interface" >/dev/null \
            || fail "$interface: an interface.defaultPrompt entry is over 128 characters"

          # The Agent Plugins schema allows only these top-level keys; Codex
          # drops the rest.
          extra=$(jq -r 'keys - ["$schema","name","version","description","author","homepage","repository","license","keywords","extensions"] | join(", ")' plugin.json)
          [ -z "$extra" ] || fail "plugin.json: keys not allowed in an Agent Plugins manifest: $extra"

          # Claude Code reads .mcp.json, which uses its own transport name;
          # Codex and Cursor read mcp.json, in the Agent Plugins format. Both
          # must declare the same servers at the same URLs.
          check_same_json "MCP server URLs" \
            '.mcp.json:.mcpServers | map_values(.url)' \
            'mcp.json:.mcpServers | map_values(.url)'
          jq -e '[.mcpServers[].type] | all(. == "http")' .mcp.json >/dev/null \
            || fail ".mcp.json: every server needs \"type\": \"http\", the name Claude Code uses"
          jq -e 'has("$schema") | not' .mcp.json >/dev/null \
            || fail ".mcp.json: no \$schema; Claude Code's format has none"

          manifests=(
            plugin.json
            .claude-plugin/plugin.json
            .claude-plugin/marketplace.json
            .cursor-plugin/plugin.json
            .cursor-plugin/marketplace.json
            .codex-plugin/plugin.json
            .agents/plugins/marketplace.json
            .mcp.json
            mcp.json
          )

          # The listing describes only what the plugin serves.
          for file in "${manifests[@]}"; do
            if grep -qiE 'experiment|evaluation|judge' "$file"; then
              fail "$file: mentions a feature the plugin does not serve"
            fi
          done

          # Every URL-valued field must use https.
          for file in "${manifests[@]}"; do
            while IFS= read -r url; do
              fail "$file: $url is not https"
            done < <(jq -r '.. | strings | select(test("^[a-z][a-z0-9+.-]*://")) | select(startswith("https://") | not)' "$file")
          done

          # Every link field must be an https URL: the directories drop any
          # other scheme, mailto: included.
          for file in "${manifests[@]}"; do
            while IFS= read -r field; do
              fail "$file: $field is not an https URL"
            done < <(jq -r 'paths(strings) as $p | select(($p[-1] | tostring) | test("(url|homepage|repository)$"; "i")) | select(getpath($p) | startswith("https://") | not) | $p | map(tostring) | join(".")' "$file")
          done

          if [ "$status" -eq 0 ]; then
            echo "plugin manifests agree"
          fi
          exit "$status"

  files:
    name: Plugin files are accepted by plugin directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail

          status=0
          fail() {
            echo "$1" >&2
            status=1
          }

          while IFS= read -r -d '' file; do
            case "$file" in
              AGENTS.md | */AGENTS.md | CLAUDE.md | */CLAUDE.md)
                fail "$file: agent instruction files are refused in a plugin" ;;
              assets/icon.svg) ;;
              *.svg | *.SVG)
                fail "$file: the only SVG allowed is the icon, assets/icon.svg" ;;
            esac
            if [ "$(head -c 2 -- "$file")" = '#!' ]; then
              fail "$file: starts with #!; executable files are refused in a plugin"
            fi
          done < <(git ls-files -z)

          while IFS= read -r line; do
            fail "${line#*$'\t'}: has the executable bit; executable files are refused in a plugin"
          done < <(git ls-files -s | awk '$1 == "100755"')

          if [ "$status" -eq 0 ]; then
            echo "no refused files"
          fi
          exit "$status"

  links:
    name: README links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail

          status=0
          count=0
          while IFS= read -r target; do
            path=${target%%#*}
            [ -n "$path" ] || continue
            count=$((count + 1))
            if [ ! -e "$path" ]; then
              echo "README.md: link to $target does not resolve" >&2
              status=1
            fi
          done < <(grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\(([^ )]+).*\)$/\1/' | grep -vE '^(https?:|mailto:|#)')

          if [ "$status" -eq 0 ]; then
            echo "all $count relative links in README.md resolve"
          fi
          exit "$status"
