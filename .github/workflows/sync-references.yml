name: Sync docs references

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-references
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refresh references from docs.three.dev
        run: ./scripts/sync-references.sh

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          sign-commits: true
          branch: bot/sync-references
          delete-branch: true
          commit-message: "Sync docs references from docs.three.dev"
          title: "Sync docs references from docs.three.dev"
          body: |
            Automated refresh of the docs pages vendored under
            `skills/three-dev/references/`, produced by `scripts/sync-references.sh`.

            Review the diff for anything the skill body should reflect, then merge.
            Nothing else in the repository is touched.
          labels: documentation
